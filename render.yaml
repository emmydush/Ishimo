# Render blueprint: one web service running the all-in-one image
# (React SPA + nginx + Node API) plus a managed PostgreSQL database.
services:
  - type: web
    name: ishimo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Injected from the managed database below.
      - key: DATABASE_URL
        fromDatabase:
          name: ishimo-db
          property: connectionString
      # Protects /api/admin/* — generated once, change it to your own value.
      - key: ADMIN_TOKEN
        generateValue: true
      # Used only while no admin password hash exists in the database.
      # Prefer creating one with `node /app/server/create-admin.js` in the Shell.
      - key: ADMIN_PASSWORD
        generateValue: true

    # Persistent disk: keeps uploaded files (worker photos, ID scans) and the
    # deploy-time database dumps across redeploys. REQUIRED for the no-data-loss
    # guarantee — do not delete this block, and note that disks need a paid
    # instance type (on the free plan Render wipes the filesystem on every
    # redeploy). Each deploy dumps the database into /app/data/backups before
    # the server starts.
    disk:
      name: ishimo-data
      mountPath: /app/data
      sizeGB: 1

# Managed PostgreSQL — Render keeps daily automatic backups of it. The web
# service connects through DATABASE_URL above.
databases:
  - name: ishimo-db
    plan: free
