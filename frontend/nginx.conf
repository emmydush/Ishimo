server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API and upload routes are handled directly by the frontend
    # The frontend makes requests to the backend URL specified in VITE_API_URL
    # No proxying needed for static site deployment
}
