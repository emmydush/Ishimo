services:
  postgres:
    image: postgres:16-alpine
    container_name: ishimo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ishimo}
      POSTGRES_USER: ${POSTGRES_USER:-ishimo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ishimo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only, for direct access with psql/pg_dump from the host.
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ishimo} -d ${POSTGRES_DB:-ishimo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ishimo-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ishimo-server
    container_name: ishimo-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Same values as the postgres service above (defaults shown).
      DATABASE_URL: postgres://${POSTGRES_USER:-ishimo}:${POSTGRES_PASSWORD:-ishimo}@postgres:5432/${POSTGRES_DB:-ishimo}
      # Set to an absolute origin (e.g. https://api.example.com) if the API is
      # served from a different domain; leave empty for same-origin URLs.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Change these before going live. The admin password itself lives in the
      # database — create it with: docker compose exec server npm run admin:create
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-secret-token-ishimo}
    volumes:
      - uploads_data:/app/uploads
    ports:
      # Loopback only: the public entry point is the client container (port 80).
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ishimo-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Leave empty: nginx proxies /api and /uploads to the server container.
        VITE_API_URL: ${VITE_API_URL:-}
    image: ishimo-client
    container_name: ishimo-client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ishimo-network

volumes:
  postgres_data:
  uploads_data:

networks:
  ishimo-network:
    driver: bridge
