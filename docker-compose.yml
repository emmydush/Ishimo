services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ishimo-server
    container_name: ishimo-server
    environment:
      NODE_ENV: production
      PORT: 3000
      SQLITE_PATH: /app/data/database.sqlite
      # Set to an absolute origin (e.g. https://api.example.com) if the API is
      # served from a different domain; leave empty for same-origin URLs.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Change these before going live. The admin password itself lives in the
      # database — create it with: docker compose exec server npm run admin:create
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-secret-token-ishimo}
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/uploads
    ports:
      # Loopback only: the public entry point is the client container (port 80).
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ishimo-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Leave empty: nginx proxies /api and /uploads to the server container.
        VITE_API_URL: ${VITE_API_URL:-}
    image: ishimo-client
    container_name: ishimo-client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ishimo-network

volumes:
  sqlite_data:
  uploads_data:

networks:
  ishimo-network:
    driver: bridge
