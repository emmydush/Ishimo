services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ishimo-server
    ports:
      - "3000:3000"
    volumes:
      - ./server/uploads:/app/uploads
      - sqlite_data:/app/data
    environment:
      - NODE_ENV=production
      - SQLITE_PATH=/app/data/database.sqlite
    restart: unless-stopped
    networks:
      - ishimo-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ishimo-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - ishimo-network

volumes:
  sqlite_data:

networks:
  ishimo-network:
    driver: bridge
