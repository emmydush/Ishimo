name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client (lint, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Fail on known vulnerabilities in shipped (production) dependencies.
      - run: npm audit --omit=dev --audit-level=high

  server:
    name: Server (audit, boot smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Fail on known vulnerabilities in shipped (production) dependencies.
      - run: npm audit --omit=dev --audit-level=high
      - name: Module smoke check
        run: node -e "require('./schema.js'); require('./database.js'); console.log('Modules OK')"
      - name: Boot smoke test
        run: |
          SQLITE_PATH=$RUNNER_TEMP/ci-smoke.sqlite PORT=3123 node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3123/api/health | grep -q '"status":"ok"'; then
              echo "Server healthy"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          kill $SERVER_PID || true
          echo "Server failed to become healthy"
          exit 1

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q

  docker:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [client, server, compose]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ishimo-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name ishimo-smoke -e PORT=80 -p 18080:80 ishimo-ci:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'; then
              echo "Container healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs ishimo-smoke
          echo "Container failed to become healthy"
          exit 1

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy hook
        if: env.DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "${{ env.DEPLOY_HOOK_URL }}"
      - name: Deploy hook not configured
        if: env.DEPLOY_HOOK_URL == ''
        run: echo "Set the RENDER_DEPLOY_HOOK_URL secret to enable automatic deploys to Render."
