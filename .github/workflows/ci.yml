name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client (lint, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Fail on known vulnerabilities in shipped (production) dependencies.
      - run: npm audit --omit=dev --audit-level=high

  server:
    name: Server (audit, boot smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ishimo
          POSTGRES_USER: ishimo
          POSTGRES_PASSWORD: ishimo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ishimo -d ishimo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ishimo:ishimo@localhost:5432/ishimo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Fail on known vulnerabilities in shipped (production) dependencies.
      - run: npm audit --omit=dev --audit-level=high
      - name: Module smoke check
        run: node -e "require('./schema.js'); const db = require('./database.js'); db.ready.then(() => db.close(() => console.log('Modules OK')))"
      - name: Boot smoke test
        run: |
          PORT=3123 node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3123/api/health | grep -q '"status":"ok"'; then
              echo "Server healthy"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          kill $SERVER_PID || true
          echo "Server failed to become healthy"
          exit 1

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q

  docker:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [client, server, compose]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ishimo-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker network create ishimo-ci-net
          docker run -d --name ishimo-smoke-pg --network ishimo-ci-net \
            -e POSTGRES_DB=ishimo -e POSTGRES_USER=ishimo -e POSTGRES_PASSWORD=ishimo \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec ishimo-smoke-pg pg_isready -U ishimo -d ishimo && break
            sleep 2
          done
          docker run -d --name ishimo-smoke --network ishimo-ci-net \
            -e PORT=80 -e DATABASE_URL=postgres://ishimo:ishimo@ishimo-smoke-pg:5432/ishimo \
            -p 18080:80 ishimo-ci:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'; then
              echo "Container healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs ishimo-smoke
          echo "Container failed to become healthy"
          exit 1

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      # Never let a push to main pass CI/CD without a production deploy.
      - name: Fail if deploy hook is not configured
        if: env.DEPLOY_HOOK_URL == ''
        run: |
          echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
          echo "Add the Render deploy hook URL as the RENDER_DEPLOY_HOOK_URL repository secret"
          echo "so that pushes to main deploy to production after CI/CD passes."
          exit 1
      - name: Trigger Render deploy hook
        if: env.DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "${{ env.DEPLOY_HOOK_URL }}"
