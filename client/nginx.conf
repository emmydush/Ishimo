# Ishimo client — static SPA with a reverse proxy to the API container.
#
# The API host is resolved at request time (via a variable) instead of at
# startup, so this image still boots on hosts where no "server" container
# exists — e.g. when VITE_API_URL points at a separate API domain.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Photo / document uploads go through here (multer has no size limit)
    client_max_body_size 15m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Docker's embedded DNS server
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_backend "server:3000";

    # ─── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ─── Uploaded photos and documents ────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── Service worker: never cache ──────────────────────────────────────────
    location ~* ^/(sw|registerSW|workbox-[^/]+)\.js$ {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ─── Hashed build assets: cache forever ───────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── SPA entry point ──────────────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
